<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title }} · TalentMatch</title>
  {% include "_auth_head.html" %}
</head>
<body class="rw auth-page">
  <nav class="navbar app-nav">
    <div class="container-fluid dashboard-shell">
      <div class="nav-left">
        <a href="/" class="navbar-brand"><span class="brand-mark" aria-hidden="true"></span> TalentMatch</a>
      </div>
      <a class="rw-nav-exit" href="/"><i class="fa-solid fa-arrow-left"></i> <span>Back to site</span></a>
    </div>
  </nav>
  <main class="auth-main" style="flex: 1;">
    <section class="auth-card">
      <h1>{{ title }}</h1>
      <p class="auth-lead">{{ message }}</p>
      <a class="btn btn-primary auth-submit" href="javascript:history.back()"><i class="fa-solid fa-arrow-left"></i> Go back</a>
    </section>
  </main>
</body>
</html>
